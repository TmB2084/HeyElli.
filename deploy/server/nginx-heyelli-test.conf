# HeyElli TESTINSTANZ – TLS-Reverse-Proxy vor dem Container (127.0.0.1:3001)
# Vorlage: Installation durch die IT nach /etc/nginx/sites-available/heyelli-test.conf, Link in sites-enabled, dann nginx -t und reload.
# Die map-Direktive für $connection_upgrade und die Catch-all-Server stehen schon in heyelli.conf und werden hier nicht wiederholt.
# Gleiches Wildcard-Zertifikat (*.elomech.de) und gleiche Zugriffsregeln wie die Produktivsite; DNS heyelli-test.elomech.de -> 10.100.11.79.

server {
    listen 80;
    listen [::]:80;
    server_name heyelli-test.elomech.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name heyelli-test.elomech.de;

    ssl_certificate     /etc/ssl/heyelli/star.elomech.de.fullchain.crt;
    ssl_certificate_key /etc/ssl/heyelli/private/star.elomech.de.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:heyelli_test_tls:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/heyelli-test.access.log;
    error_log  /var/log/nginx/heyelli-test.error.log;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # Vertrauenswuerdige Client-IP fuer HeyElli (AUTH_LOGIN_SOURCE_HEADER); fremde Werte werden ueberschrieben
        proxy_set_header x-heyelli-client-ip $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
