name: HeyElli PR verification

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: heyelli-verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use project Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Check isolated test prerequisites
        run: |
          test "$(node --version)" = "$(cat .node-version)"
          git --version
          python3 --version
          tar --version
          docker info > /dev/null
          docker compose version

      - name: Verify exact PR merge commit
        env:
          VERIFY_COMMIT: ${{ github.sha }}
        run: npm run verify -- --commit "$VERIFY_COMMIT" --report .local/verification/github-verify.json

      # Literal allowlist only: never upload .local as a directory, raw logs,
      # traces, cookies, temporary fixture files, screenshots or credentials.
      - name: Upload sanitized verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heyelli-verify-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .local/verification/github-verify.json
            .local/verification/browser/results.json
            .local/verification/browser/cleanup.json
            .local/verification/browser/mutations.json
            .local/verification/browser/mutation-navigation/results.json
            .local/verification/browser/mutation-navigation/cleanup.json
            .local/verification/browser/mutation-rights/results.json
            .local/verification/browser/mutation-rights/cleanup.json
